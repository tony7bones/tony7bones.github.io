<!doctype html>
<html>
  <head>
    <title>Tony 7 Bones</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
      }

      .avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #444;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <img src="images/tony7bones.jpg" alt="Tony 7 Bones" class="avatar" />
  </body>
</html>

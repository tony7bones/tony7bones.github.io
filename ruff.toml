# The ruff version is declared here as well as in requirements-ci.txt, so that
# running `ruff check` by hand with the WRONG version fails with one clear
# sentence instead of a wall of findings that look like real defects.
#
# On 2026-07-24 and 07-25 the scheduled deploy failed with 95 findings against
# code nobody had touched since 07-22: ruff 0.16.0 had moved rules into its
# stable set. The findings were not defects, they were a version change wearing
# a defect costume, and that cost real time to unmask.
#
# Keep this equal to the ruff pin in requirements-ci.txt. Bump both together, in
# a commit that also clears whatever the new version flags.
required-version = "==0.15.22"

[lint]
# THIS is the actual fix for the 2026-07-24 outage, and the version pin above is
# only the belt to its braces. The floating input was never ruff's version, it
# was ruff's DEFAULT RULE SET, which a release is free to change. Declaring the
# set explicitly makes the two versions agree exactly: measured on this tree,
# 0.15.22 and 0.16.0 both report 0 findings here with these rules, against 0 and
# 95 on their respective defaults.
#
# These four are ruff's pre-0.16 defaults, written down rather than inherited:
#   E4 imports, E7 statements, E9 syntax/IO errors, F pyflakes.
# Widening the set is a deliberate choice to make in its own commit, alongside
# clearing whatever it flags. It is not something a `pip install` gets to decide.
select = ["E4", "E7", "E9", "F"]

# Static site pipeline: build the ENTIRE served site in CI, deploy it via
# GitHub Pages (source = GitHub Actions), and verify it from the consumer's
# seat. Historical phase plan: the fleet meta-repo,
# docs/static-repo-and-tailscale.md.
#
# Main is sources-only: the served canvas mirror, root index, robots.txt,
# /static/ catalog, and root installer are all generated by build_site.py
# into the artifact - never committed. The build IS the deploy, so every
# push to main builds and deploys (no path filter: any tracked file can
# shape the artifact).
#
# generate_repo.yml remains the push-validation workflow; the gates here
# deliberately re-run the same suite so THIS workflow alone is sufficient
# evidence that an artifact was fit to deploy.

name: Build & Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily third-party snapshot + release-asset freshness (see the
    # refresh-third-party flag below). Kodi-side staleness bound: <=24h for
    # third-party listings, minutes for owned content (push-triggered).
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      allow_catalog_shrink:
        description: "Allow the catalog to lose entries vs the live baseline"
        type: boolean
        default: false
      refresh_third_party:
        description: "Re-fetch mutable upstream metadata/art"
        type: boolean
        default: false
  repository_dispatch:
    types: [estuary7-release, ezmpp-release]

# Deploy credentials (pages/id-token) are scoped to the deploy job only -
# the build job never needs them.
permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  T7B_FETCH_CACHE: /home/runner/.cache/t7b-fetch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ruff is PINNED. Unpinned, a new ruff release changes the stable rule set
      # under a repo at rest and fails the deploy with zero commits pushed: ruff
      # 0.16.0 (2026-07-23) did exactly that, red-lighting this workflow on the
      # 07-24 and 07-25 scheduled runs with 95 findings on code last touched
      # 07-22. Same commit is clean on 0.15.22. Bump this deliberately, in a
      # commit that also clears whatever the new rules flag.
      - name: Install tooling deps
        run: pip install pytest ruff==0.15.22

      - name: Test suite
        run: python3 -m pytest _tools/ -q

      - name: Lint
        run: ruff check _tools/

      - name: Hosted release-freshness gate
        # The gate handles the release-race window itself, and it is TIME-AWARE:
        # "mirror behind latest" is a non-failing warning while the latest release
        # is younger than HOSTED_FRESHNESS_GRACE_SECONDS (default 2h), and a hard
        # failure once it is older. Broken pointers (no release / missing asset)
        # always hard-fail. So the race window still never fails this step on ANY
        # event, and no per-event continue-on-error is needed. Do NOT add one: it
        # would swallow GENUINE broken-pointer failures AND the genuinely-stale
        # mirror this gate now catches, on schedule/repository_dispatch - which is
        # precisely where the daily cron is the only thing watching.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 _tools/check_hosted_release_sync.py

      # The committed add-on artifacts (per-add-on zips, addons.xml + hashes)
      # must be fresh - a stale commit would feed the static catalog stale
      # first-party bytes.
      - name: Committed-tree staleness gate
        run: |
          python3 _tools/generate_repo.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generated files are stale - run generate_repo.py and commit"
            git status --porcelain
            exit 1
          fi

      # The same version gates the validation workflow runs: a deploy must
      # never be possible for a commit that fails them (red validation +
      # green deploy = fleet served a bad state).

      - name: Version-bump gate (every changed add-on bumped)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: CHECK_VERSIONS_BASE_REF="${{ github.event.before }}" python3 _tools/check_versions.py

      # Per-run key: actions/cache only SAVES on an exact-key miss, so a
      # content-hash key would discard the daily cron's refreshed snapshots
      # and every later push would DOWNGRADE the live third-party versions
      # back to the stale cache. A run-id key saves every run; prefix
      # restore picks the newest; GitHub's 10GB LRU evicts old ones.
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/t7b-fetch
          key: t7b-fetch-v1-${{ github.run_id }}
          restore-keys: |
            t7b-fetch-v1-

      - name: Build site
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh_third_party }}" = "true" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FLAGS="$FLAGS --refresh-third-party"
          fi
          if [ "${{ inputs.allow_catalog_shrink }}" = "true" ]; then
            FLAGS="$FLAGS --allow-catalog-shrink"
          fi
          echo "flags: $FLAGS"
          python3 _tools/build_site.py --out _site $FLAGS

      - name: Secret gate on the built artifact
        run: python3 _tools/check_site_secrets.py _site

      # Second build reads the cache the first build populated (no refresh
      # flag), so byte-inequality here means real nondeterminism, not drift.
      - name: Determinism gate (double build, byte diff)
        run: |
          FLAGS=""
          if [ "${{ inputs.allow_catalog_shrink }}" = "true" ]; then
            FLAGS="$FLAGS --allow-catalog-shrink"
          fi
          python3 _tools/build_site.py --out _site2 $FLAGS
          diff -r _site _site2

      - name: Upload build manifest (for the verify job + audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: _site/static/catalog.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # PHASE 1: ENABLED 2026-07-15 (owner "proceed"). The configure step flips
    # the Pages source to GitHub Actions using the workflow token (the
    # moquette account has push-not-admin, so the REST flip was unavailable).
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (source = GitHub Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    # PHASE 1: ENABLED 2026-07-15 (owner "proceed").
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: catalog
      - name: Consumer-seat verification (the same URLs Kodi uses)
        run: |
          FLAGS="--transition --attempts 18 --delay 10"
          if [ "${{ inputs.allow_catalog_shrink }}" != "true" ]; then
            EXPECTED=$(python3 -c "import json; print(len(json.load(open('_tools/catalog.json'))))")
            FLAGS="$FLAGS --expect-count $EXPECTED"
          fi
          python3 _tools/verify_live_site.py --manifest catalog.json $FLAGS

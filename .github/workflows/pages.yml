# Static site pipeline: build the ENTIRE served site in CI, deploy it via
# GitHub Pages (source = GitHub Actions), and verify it from the consumer's
# seat. Historical phase plan: the fleet meta-repo,
# docs/static-repo-and-tailscale.md.
#
# Main is sources-only: the served canvas mirror, root index, robots.txt,
# /static/ catalog, and root installer are all generated by build_site.py
# into the artifact - never committed. The build IS the deploy, so every
# push to main builds and deploys (no path filter: any tracked file can
# shape the artifact).
#
# This is the ONE push workflow (generate_repo.yml, which re-ran the same
# gates step for step, was deleted 2026-09-26). The test suite, lint and the
# version-bump gate judge the pushed SOURCE, so they run on push only; the
# cron and repository_dispatch runs change no hub source, and they keep the
# build, secret gate, determinism diff, deploy and live verify, which judge
# the ARTIFACT.

name: Build & Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily third-party snapshot (see the refresh-third-party flag below).
    # Kodi-side staleness bound: <=24h for third-party listings, minutes for
    # owned content: the build resolves the latest EZM++ release, the newest
    # skin.estuary.plusplus release and the POV upstream index fresh on EVERY run,
    # so a push, this cron and the ezmpp-release dispatch all pick up a new
    # version with no commit here.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      allow_catalog_shrink:
        description: "Allow the catalog to lose entries vs the live baseline"
        type: boolean
        default: false
      refresh_third_party:
        description: "Re-fetch mutable upstream metadata/art"
        type: boolean
        default: false
  repository_dispatch:
    # The type name is historical (ezmpp was the first sibling repo to
    # dispatch here); estuarypp's CI sends the same type for the skin.
    types: [ezmpp-release]

# Deploy credentials (pages/id-token) are scoped to the deploy job only -
# the build job never needs them.
permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  T7B_FETCH_CACHE: /home/runner/.cache/t7b-fetch

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Versions live in requirements-ci.txt, which .githooks/pre-push installs
      # from too, so the local gate and CI can never disagree about a tool
      # version. See that file for why these are pinned at all.
      - name: Install tooling deps
        run: pip install -r requirements-ci.txt

      - name: Test suite
        if: github.event_name == 'push'
        run: python3 -m pytest _tools/ -q

      - name: Lint
        if: github.event_name == 'push'
        run: ruff check _tools/

      # Documentation drift: retired names, dead links and paths, unresolved
      # section signs, banned dashes and stale add-on versions in this repo's
      # living docs. .github/doccheck.py + .github/doccheck.json are a
      # byte-identical copy of the meta root's bin/doccheck (moquette/kodi is
      # private, so this public repo cannot fetch it); the meta root's
      # tests/test_doccheck.py fails when the copy drifts.
      - name: Documentation drift (doccheck)
        if: github.event_name == 'push'
        run: python3 .github/doccheck.py --repo .

      # The committed add-on artifacts (per-add-on zips, addons.xml + hashes)
      # must be fresh - a stale commit would feed the static catalog stale
      # first-party bytes.
      - name: Committed-tree staleness gate
        run: |
          python3 _tools/generate_repo.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generated files are stale - run generate_repo.py and commit"
            git status --porcelain
            exit 1
          fi

      # The per-add-on "every changed add-on bumped its version" gate
      # (check_versions.py) also runs in the pre-push hook, but a --no-verify
      # or un-hooked push could ship a same-version byte change, invisible to
      # Kodi's version-only auto-upgrade; this is the backstop. The baseline is
      # the push's "before" SHA: on main, origin/main already equals the pushed
      # HEAD, so comparing against it would judge the commit against itself
      # and pass vacuously. The all-zeros "before" (a first push) and a
      # baseline this checkout cannot resolve are skipped cleanly.
      - name: Version-bump gate (every changed add-on bumped)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || \
             [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || \
             ! git rev-parse --verify --quiet "$BEFORE_SHA" >/dev/null; then
            echo "no usable 'before' baseline ($BEFORE_SHA), skipping version-bump gate"
            exit 0
          fi
          CHECK_VERSIONS_BASE_REF="$BEFORE_SHA" python3 _tools/check_versions.py

      # Per-run key: actions/cache only SAVES on an exact-key miss, so a
      # content-hash key would discard the daily cron's refreshed snapshots
      # and every later push would DOWNGRADE the live third-party versions
      # back to the stale cache. A run-id key saves every run; prefix
      # restore picks the newest; GitHub's 10GB LRU evicts old ones.
      - name: Restore download cache
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/t7b-fetch
          key: t7b-fetch-v1-${{ github.run_id }}
          restore-keys: |
            t7b-fetch-v1-

      # GH_TOKEN authenticates the release lookups for release-asset entries
      # (static_catalog: releases/latest for ezmpp, the namespaced listing for
      # the skin). For a PUBLIC source repo the build resolves without any
      # token (redirect, anonymous API), which is what a developer machine
      # does; the token only keeps CI off the shared-runner anonymous limit.
      # Both source repos (moquette/kodi-ezmpp, moquette/kodi-estuarypp) are
      # PUBLIC (the skin repo since 2026-09-26), so T7B_SOURCE_READ_TOKEN is an
      # optional escape hatch, not a requirement: if a source repo ever goes
      # private again, store a token that can read it under that name and the
      # build keeps resolving; without one it serves the last-good copy, stale,
      # with a ::warning:: in this log.
      - name: Build site
        env:
          GH_TOKEN: ${{ secrets.T7B_SOURCE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh_third_party }}" = "true" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FLAGS="$FLAGS --refresh-third-party"
          fi
          if [ "${{ inputs.allow_catalog_shrink }}" = "true" ]; then
            FLAGS="$FLAGS --allow-catalog-shrink"
          fi
          echo "flags: $FLAGS"
          python3 _tools/build_site.py --out _site $FLAGS

      - name: Secret gate on the built artifact
        run: python3 _tools/check_site_secrets.py _site

      # Second build reads the cache the first build populated (no refresh
      # flag), so byte-inequality here means real nondeterminism, not drift.
      - name: Determinism gate (double build, byte diff)
        env:
          GH_TOKEN: ${{ secrets.T7B_SOURCE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.allow_catalog_shrink }}" = "true" ]; then
            FLAGS="$FLAGS --allow-catalog-shrink"
          fi
          python3 _tools/build_site.py --out _site2 $FLAGS
          diff -r _site _site2

      - name: Upload build manifest (for the verify job + audit trail)
        uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: _site/static/catalog.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # PHASE 1: ENABLED 2026-07-15 (owner "proceed"). The configure step flips
    # the Pages source to GitHub Actions using the workflow token (the
    # moquette account has push-not-admin, so the REST flip was unavailable).
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (source = GitHub Actions)
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    # PHASE 1: ENABLED 2026-07-15 (owner "proceed").
    needs: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: catalog
      - name: Consumer-seat verification (the same URLs Kodi uses)
        run: |
          FLAGS="--transition --attempts 18 --delay 10"
          if [ "${{ inputs.allow_catalog_shrink }}" != "true" ]; then
            EXPECTED=$(python3 -c "import json; print(len(json.load(open('_tools/catalog.json'))))")
            FLAGS="$FLAGS --expect-count $EXPECTED"
          fi
          python3 _tools/verify_live_site.py --manifest catalog.json $FLAGS

      # The hub also runs GitHub's own branch build ("pages-build-deployment")
      # on every push, and the two deployments race. Ours has won on every push
      # since at least 2026-08-16, and lost once on 2026-09-26: the branch build
      # landed last and the live site went 404 everywhere, /static/ included,
      # even though build and deploy here were green. A redeploy with no push
      # behind it has nothing to race, so on a failed verify of a PUSH run this
      # dispatches the workflow once more. Only push runs re-dispatch, so a
      # genuinely broken site cannot loop: the re-run is a workflow_dispatch
      # and its own failure stops here.
      - name: Redeploy once if the branch build clobbered this deploy
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

name: Publish dist branch

# The "translator": compiles the source on main into the generated output and
# publishes it to the `dist` branch, which the proxy will eventually fetch from.
#
# PHASE 1b: runs automatically on every push to main that changes served
# content (repo/**, _tools/**, index.html), and still on-demand via the manual
# button. Nothing reads `dist` yet, so this remains invisible to the live site
# and to installed Kodi boxes — `dist` is just kept continuously up to date.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "repo/**"
      - "_tools/**"
      - "index.html"

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build generated repo
        run: python3 _tools/generate_repo.py

      - name: Publish built tree to dist
        run: |
          git config user.name "tony7bones-ci"
          git config user.email "ci@tony7bones.invalid"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes — dist will mirror main HEAD ($GITHUB_SHA)."
          else
            git commit -m "build: dist artifacts from ${GITHUB_SHA:0:7}"
          fi
          git push --force origin HEAD:refs/heads/dist
          echo "Published dist -> $(git rev-parse HEAD)"

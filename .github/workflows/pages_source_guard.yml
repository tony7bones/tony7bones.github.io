# The hub must be served from the Pages ARTIFACT this repo's workflow builds,
# never from the main branch: main is sources-only, so a branch build serves a
# site with no /static/, no root index and no installer. With the Pages source
# on "branch", GitHub also runs its own branch build on every push and the two
# deployments race; ours won every time from at least 2026-08-16 until
# 2026-09-26, when the branch build landed last and the whole site went 404.
#
# The setting is repository-level. This job reads it and, when it is not
# "workflow", puts it back, so a wrong click or a platform reset cannot stay
# wrong past the next run. Runs daily and on demand.
#
# MEASURED 2026-09-26 (run 36250208404): the workflow's own GITHUB_TOKEN can
# READ the setting but the update returns 403 "Resource not accessible by
# integration"; changing it needs the repository owner's authority. So the
# write uses the T7B_PAGES_ADMIN_TOKEN secret when the owner has stored one
# (a classic PAT with repo scope, or a fine-grained token with Pages: write
# and Administration: write on this repo, created by the tony7bones account),
# and otherwise reports the drift as a warning without failing, because a red
# run nobody can act on is noise. Until that secret exists, pages.yml's
# "Redeploy once" step is what recovers a lost race.

name: Pages source guard

on:
  schedule:
    - cron: "3 9 * * *"
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.T7B_PAGES_ADMIN_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Keep the Pages source on GitHub Actions
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/${REPO}/pages" --jq .build_type)
          echo "pages build_type: ${CURRENT}"
          if [ "$CURRENT" = "workflow" ]; then
            echo "OK"
            exit 0
          fi
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::Pages source is '${CURRENT}', not 'workflow'. The workflow token cannot change it (403, measured 2026-09-26). Store a T7B_PAGES_ADMIN_TOKEN secret from the tony7bones account, or set Settings > Pages > Source to GitHub Actions by hand."
            exit 0
          fi
          echo "::warning::Pages source is '${CURRENT}', switching to 'workflow' with T7B_PAGES_ADMIN_TOKEN"
          GH_TOKEN="$ADMIN_TOKEN" gh api -X PUT "repos/${REPO}/pages" -f build_type=workflow
          gh api "repos/${REPO}/pages" --jq '"now: " + .build_type'

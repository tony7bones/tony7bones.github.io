name: Validate Kodi Repository

on:
  push:
    paths:
      - "repo/**/addon.xml"
      - "repo/media/**"
      - "repo/repositories/**"
      - "repo/**"
      - "_tools/**.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python3 -m pytest _tools/ -q

      - name: Regenerate and commit if stale
        run: |
          python3 _tools/generate_repo.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: regenerate repo indexes"
            git push
          fi

name: Generate Kodi Repository

on:
  push:
    paths:
      - "repo/**/addon.xml"
      - "repo/media/**"
      - "repo/repositories/**"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate repository files
        run: python3 _tools/generate_repo.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/addons.xml repo/addons.xml.sha256 repo/addons.xml.md5 "repo/**/*.zip" "repo/**/index.html"
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Update repository files"
          git push

name: Validate Kodi Repository

on:
  push:
    paths:
      - "repo/**/addon.xml"
      - "repo/media/**"
      - "repo/repositories/**"
      - "repo/scripts/**"
      - "_tools/generate_repo.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m pytest _tools/test_generate_repo.py -q

      - name: Verify generated files are up to date
        run: |
          python3 _tools/generate_repo.py
          git diff --exit-code || (echo "Generated files are out of date — run generate_repo.py locally before committing." && exit 1)

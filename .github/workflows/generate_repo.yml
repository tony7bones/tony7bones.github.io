name: Validate Kodi Repository

on:
  push:
    paths:
      - "repo/**/addon.xml"
      - "repo/media/**"
      - "repo/repositories/**"
      - "repo/**"
      - "_tools/generate_repo.py"
      - "_tools/test_generate_repo.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python3 -m pytest _tools/test_generate_repo.py -q

      - name: Verify generated files are up to date
        # CI NEVER commits to main. It only validates. If anything is stale the
        # author must run `python3 _tools/generate_repo.py` and commit — every
        # real change ships with its own version bump (Kodi auto-upgrade relies
        # on the version, not byte churn).
        run: |
          python3 _tools/generate_repo.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are stale. Run 'python3 _tools/generate_repo.py' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

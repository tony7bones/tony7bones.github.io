name: Validate Kodi Repository

on:
  push:
    # Branch pushes only — tag pushes (from deploy.py's atomic main+tag push)
    # re-point at main's HEAD, which already ran; and on a tag checkout the
    # consistency gate can't resolve the main branch, so the tag run fails spuriously.
    branches:
      - main
    paths:
      - "repo/**"
      - "_tools/**"
      - "index.html"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest ruff

      - name: Run tests
        run: python3 -m pytest _tools/ -q

      - name: Lint
        run: ruff check _tools/

      - name: Verify generated files are up to date
        # CI NEVER commits to main. It only validates. If anything is stale the
        # author must run `python3 _tools/generate_repo.py` and commit — every
        # real change ships with its own version bump (Kodi auto-upgrade relies
        # on the version, not byte churn).
        run: |
          python3 _tools/generate_repo.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are stale. Run 'python3 _tools/generate_repo.py' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Version-consistency gate
        # Backstop for the local pre-push hook: every version-bearing location
        # on main must agree and be tagged.
        run: |
          git fetch --quiet --tags origin
          python3 _tools/check_consistency.py

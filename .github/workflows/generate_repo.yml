name: Validate Kodi Repository

on:
  push:
    # Branch pushes only — tag pushes (from deploy.py's atomic main+tag push)
    # re-point at main's HEAD, which already ran; and on a tag checkout the
    # consistency gate can't resolve the main branch, so the tag run fails spuriously.
    # modular-setup added in Phase 6 so the setup-rewrite invariants gate that
    # branch in CI too (the version-consistency step stays main-only below).
    branches:
      - main
      - modular-setup
    paths:
      - "addons/**"
      - "dropbox/**"
      - "_tools/**"
      - "index.html"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest ruff

      - name: Run tests
        run: python3 -m pytest _tools/ -q

      # NOTE: the old "Setup invariant gates" re-run step was removed 2026-07-16.
      # It re-ran _tools/test_no_fork.py / test_version_guard.py /
      # test_setup_probes.py as a loudly-named subset, but all three were DELETED
      # with the Setup add-on family (Express/Guided wizards, library/bootstrap),
      # so the step failed every push with "file not found" - it had been red for
      # weeks. The full suite above (pytest _tools/ -q) already runs every gate
      # that still exists; there is nothing left to re-run separately.

      - name: Lint
        run: ruff check _tools/

      - name: Hosted-mirror release-freshness gate
        # Every addons/hosted/<id> mirror whose repository.json asset template
        # points at a GitHub Releases download URL (skin.estuary7 -> moquette/
        # estuary7, script.ezmaintenanceplusplus -> moquette/ezmaintenanceplusplus)
        # must resolve to a REAL, LATEST published release on the source repo —
        # a silent mismatch here 404s a fresh install or serves a stale build
        # forever, with no error anywhere. Talks to the live GitHub REST API;
        # works unauthenticated too (rate-limited), but GH_TOKEN here keeps CI
        # off the shared-runner-IP anonymous limit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 _tools/check_hosted_release_sync.py

      - name: Verify generated files are up to date
        # CI NEVER commits to main. It only validates. If anything is stale the
        # author must run `python3 _tools/generate_repo.py` and commit — every
        # real change ships with its own version bump (Kodi auto-upgrade relies
        # on the version, not byte churn).
        run: |
          python3 _tools/generate_repo.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are stale. Run 'python3 _tools/generate_repo.py' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Version-bump gate (every changed add-on bumped)
        # O7 fix: the per-add-on monotonic "every changed add-on bumped its
        # version" gate (check_versions.py) used to run ONLY in the pre-push
        # hook. De-pinning the version tests (release-automation Phase 1) made
        # that the SOLE place the guarantee lived — so a --no-verify or un-hooked
        # push could ship a same-version byte change (invisible to Kodi's
        # version-only auto-upgrade). This wires the gate into CI as a backstop.
        #
        # MAIN ONLY, and the baseline is the push's "before" SHA: on main,
        # origin/main already equals the pushed HEAD, so comparing against
        # origin/main would judge the commit against itself and pass vacuously.
        # github.event.before is the commit main pointed at before this push, so
        # the gate validates the bump across exactly the pushed range. The
        # all-zeros "before" (a branch's first push) and a missing baseline are
        # skipped cleanly (no false block).
        if: github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || \
             [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || \
             ! git rev-parse --verify --quiet "$BEFORE_SHA" >/dev/null; then
            echo "no usable 'before' baseline ($BEFORE_SHA) — skipping version-bump gate"
            exit 0
          fi
          CHECK_VERSIONS_BASE_REF="$BEFORE_SHA" python3 _tools/check_versions.py

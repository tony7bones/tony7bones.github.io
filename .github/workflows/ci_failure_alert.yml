# A red run that nobody hears is not a gate. The hosted-mirror freshness gate
# went red on 2026-09-17 and the daily Pages deploy failed five mornings in a
# row; nothing told anyone, and every box served a stale build for nine days.
#
# This turns a failed run of either deploy-path workflow into a GitHub issue
# assigned to the owner (assignment sends an email and a GitHub notification),
# one issue per workflow, kept open and commented while it keeps failing, and
# closed automatically by the next green run of the same workflow.

name: Alert on CI failure

on:
  workflow_run:
    workflows: ["Build & Deploy Pages", "Validate Kodi Repository"]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      EVENT: ${{ github.event.workflow_run.event }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      ASSIGNEE: moquette
    steps:
      - name: Open, update or close the alert issue
        run: |
          set -euo pipefail
          TITLE="CI failing: ${WORKFLOW}"
          EXISTING=$(gh issue list -R "$REPO" --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          case "$CONCLUSION" in
            failure|timed_out)
              LINE="Run ${RUN_URL} (${EVENT}, ${SHA:0:7}) finished: ${CONCLUSION}."
              if [ -n "$EXISTING" ]; then
                gh issue comment "$EXISTING" -R "$REPO" --body "$LINE"
                echo "commented on #$EXISTING"
              else
                gh issue create -R "$REPO" --title "$TITLE" --assignee "$ASSIGNEE" \
                  --body "$LINE"$'\n\n'"Opened automatically by the CI failure alert. It stays open, with one comment per further failure, until the next green run of this workflow closes it."
                echo "opened a new issue"
              fi
              ;;
            success)
              if [ -n "$EXISTING" ]; then
                gh issue close "$EXISTING" -R "$REPO" --comment "Green again: ${RUN_URL} (${EVENT}, ${SHA:0:7})."
                echo "closed #$EXISTING"
              else
                echo "green and nothing open, nothing to do"
              fi
              ;;
            *)
              echo "conclusion ${CONCLUSION}: ignored"
              ;;
          esac
